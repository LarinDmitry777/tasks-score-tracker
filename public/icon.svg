<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="glow-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="256" y1="55" x2="256" y2="457" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow-bg)"/>

  <!-- Lightning bolt -->
  <path d="M295,55 L185,270 L265,270 L220,457 L368,225 L280,225 L355,55 Z"
        fill="url(#bolt)" filter="url(#glow)"/>

  <!-- Accent dots -->
  <circle cx="138" cy="158" r="11" fill="#d946ef" opacity="0.65"/>
  <circle cx="128" cy="352" r="7" fill="#a855f7" opacity="0.5"/>
  <circle cx="392" cy="392" r="9" fill="#c084fc" opacity="0.5"/>
</svg>
